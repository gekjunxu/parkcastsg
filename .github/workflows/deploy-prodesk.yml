name: Deploy to prodesk

on:
  workflow_dispatch:
    inputs:
      deployment_name:
        description: "Name for this isolated deployment (defaults to the selected branch)"
        required: false
        type: string
      port:
        description: "Host port (blank/0 auto-allocates a stable port in 18000-18999)"
        required: false
        default: "0"
        type: string
      public_path:
        description: "Public HTTPS path on the existing Funnel (for example parkcast)"
        required: false
        default: "parkcast"
        type: string

permissions:
  contents: read

concurrency:
  group: prodesk-${{ github.event.inputs.deployment_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PRODESK_USER: ${{ secrets.PRODESK_USER || 'junxu' }}
      PRODESK_HOST: ${{ secrets.PRODESK_HOST || 'prodesk' }}
      PRODESK_DEPLOYMENT_ROOT: ${{ secrets.PRODESK_DEPLOYMENT_ROOT || 'parkcastsg-deployments' }}
      LTA_API_KEY: ${{ secrets.LTA_API_KEY }}
      CORS_ALLOW_ORIGINS: ${{ secrets.CORS_ALLOW_ORIGINS }}
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Connect runner to Tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.PRODESK_HOST || 'prodesk' }}

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODESK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODESK_KNOWN_HOSTS || vars.PRODESK_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "PRODESK_SSH_PRIVATE_KEY is not configured" >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            echo "::warning::PRODESK_KNOWN_HOSTS is not configured; trusting ssh-keyscan output for this run"
            ssh-keyscan -T 10 "$PRODESK_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          test -s "$HOME/.ssh/known_hosts" || { echo "could not determine the SSH host key for $PRODESK_HOST" >&2; exit 1; }
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Validate Docker on prodesk
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$PRODESK_USER@$PRODESK_HOST" 'docker compose version'

      - name: Prepare deployment archive
        shell: bash
        env:
          DEPLOYMENT_NAME_INPUT: ${{ github.event.inputs.deployment_name }}
        run: |
          set -euo pipefail
          raw_name="${DEPLOYMENT_NAME_INPUT:-${GITHUB_REF_NAME}}"
          slug="$(printf '%s' "$raw_name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g; s/^-+//; s/-+$//' | cut -c1-48)"
          test -n "$slug" || { echo "deployment name is empty after sanitization" >&2; exit 1; }
          printf '%s\n' "$slug" > "$RUNNER_TEMP/parkcast-deployment-slug"
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./dist' --exclude='./.env' -czf "$RUNNER_TEMP/parkcast-source.tgz" .

      - name: Upload source and runtime configuration
        shell: bash
        env:
          DEPLOYMENT_PORT: ${{ github.event.inputs.port || '0' }}
          PUBLIC_PATH_INPUT: ${{ github.event.inputs.public_path || 'parkcast' }}
        run: |
          set -euo pipefail
          slug="$(cat "$RUNNER_TEMP/parkcast-deployment-slug")"
          public_slug="$(printf '%s' "$PUBLIC_PATH_INPUT" | tr '[:upper:]' '[:lower:]' | sed -E 's#^/+##; s#/+$##; s#[^a-z0-9_-]+#-#g; s#-+#-#g; s#^-+##; s#-+$##')"
          test -n "$public_slug" || { echo "public path must contain a letter or number" >&2; exit 1; }
          public_path="/$public_slug"
          printf '%s\n' "$public_path" > "$RUNNER_TEMP/parkcast-public-path"
          remote="$PRODESK_USER@$PRODESK_HOST"
          remote_dir="$PRODESK_DEPLOYMENT_ROOT/$slug"
          ssh "$remote" "mkdir -p '$remote_dir'"
          scp "$RUNNER_TEMP/parkcast-source.tgz" "$remote:$remote_dir/source.tgz"
          {
            printf 'PARKCAST_PORT=%s\n' "${DEPLOYMENT_PORT:-0}"
            printf 'ENVIRONMENT=production\n'
            printf 'APP_BASE_PATH=%s\n' "$public_path"
            printf 'VITE_BASE_PATH=%s/\n' "$public_path"
            printf 'LTA_API_KEY=%s\n' "$LTA_API_KEY"
            printf 'CORS_ALLOW_ORIGINS=%s\n' "$CORS_ALLOW_ORIGINS"
          } > "$RUNNER_TEMP/parkcast.env"
          scp "$RUNNER_TEMP/parkcast.env" "$remote:$remote_dir/.env"

      - name: Build and start isolated Compose project
        shell: bash
        run: |
          set -euo pipefail
          slug="$(cat "$RUNNER_TEMP/parkcast-deployment-slug")"
          remote="$PRODESK_USER@$PRODESK_HOST"
          remote_dir="$PRODESK_DEPLOYMENT_ROOT/$slug"
          ssh "$remote" "tar -xzf '$remote_dir/source.tgz' -C '$remote_dir' && rm -f '$remote_dir/source.tgz' && cd '$remote_dir' && chmod +x deploy/remote-deploy.sh && export PARKCAST_DEPLOY_ROOT=\"\$(pwd)/..\" && ./deploy/remote-deploy.sh '$slug' '${{ github.event.inputs.port || '0' }}'"

      - name: Configure public HTTPS path
        shell: bash
        run: |
          set -euo pipefail
          slug="$(cat "$RUNNER_TEMP/parkcast-deployment-slug")"
          public_path="$(cat "$RUNNER_TEMP/parkcast-public-path")"
          remote="$PRODESK_USER@$PRODESK_HOST"
          remote_dir="$PRODESK_DEPLOYMENT_ROOT/$slug"
          port="$(ssh "$remote" "sed -n 's/^PARKCAST_PORT=//p' '$remote_dir/.env'")"
          case "$port" in
            ''|*[!0-9]*) echo "could not determine deployed port" >&2; exit 1 ;;
          esac
          ssh "$remote" "if sudo -n tailscale funnel --https=443 --set-path='$public_path' --yes --bg http://127.0.0.1:$port; then :; elif tailscale funnel --https=443 --set-path='$public_path' --yes --bg http://127.0.0.1:$port; then :; else echo 'Unable to configure Tailscale Funnel; run the command manually with sudo on prodesk.' >&2; exit 1; fi; (sudo -n tailscale funnel status || tailscale funnel status)"
