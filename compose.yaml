services:
  parkcastsg:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ""
        VITE_BASE_PATH: "${VITE_BASE_PATH:-/}"
    ports:
      - "${PARKCAST_PORT:-8080}:8000"
    environment:
      ENVIRONMENT: production
      APP_BASE_PATH: "${APP_BASE_PATH:-/}"
      LTA_API_KEY: "${LTA_API_KEY:-}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-}"
    restart: unless-stopped
